<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gameloft Pro // Tic Tac Toe Elite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
  :root {
    --bg-main: #070913;
    --panel-bg: rgba(18, 24, 43, 0.85);
    --player-x: #ff2a5f;
    --player-x-glow: rgba(255, 42, 95, 0.45);
    --player-o: #00f0ff;
    --player-o-glow: rgba(0, 240, 255, 0.45);
    --gold: #ffd600;
    --board-border: rgba(255, 255, 255, 0.08);
    --tile-bg: rgba(23, 32, 56, 0.6);
    --tile-hover: rgba(33, 46, 80, 0.9);
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 20%, #151d38 0%, var(--bg-main) 100%);
    color: #ffffff;
    padding: 20px;
  }

  .arcade-card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 28px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    overflow: hidden;
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--player-o);
    background: rgba(0, 240, 255, 0.1);
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 8px;
    border: 1px solid rgba(0, 240, 255, 0.2);
  }

  h1 {
    margin: 0 0 16px 0;
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .settings-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  select, .btn-action {
    flex: 1;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    background: #17223b;
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  select:hover, .btn-action:hover {
    border-color: var(--player-o);
    background: #1f2e4f;
  }

  .metrics-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: rgba(0, 0, 0, 0.35);
    border-radius: 12px;
    padding: 12px 6px;
    margin-bottom: 20px;
    border: 1px solid var(--board-border);
  }

  .metric-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .metric-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7b8ea8;
  }

  .metric-value {
    font-size: 1.3rem;
    font-weight: 800;
  }

  #status-feed {
    min-height: 24px;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }

  .board-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    height: 100%;
  }

  .cell {
    background: var(--tile-bg);
    border-radius: 12px;
    border: 1px solid var(--board-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: 900;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  }

  .cell:hover:not(.locked) {
    background: var(--tile-hover);
    transform: translateY(-2px);
  }

  .cell:active:not(.locked) {
    transform: scale(0.96);
  }

  .cell.x {
    color: var(--player-x);
    text-shadow: 0 0 20px var(--player-x-glow);
  }

  .cell.o {
    color: var(--player-o);
    text-shadow: 0 0 20px var(--player-o-glow);
  }

  .cell.win-highlight {
    animation: pulseWin 1s infinite alternate;
  }

  @keyframes pulseWin {
    0% { background: var(--tile-bg); }
    100% { background: rgba(255, 214, 0, 0.2); box-shadow: 0 0 20px rgba(255, 214, 0, 0.3); }
  }

  .action-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #ff2a5f, #ff6b4a);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 42, 95, 0.3);
    transition: opacity 0.2s, transform 0.1s;
  }

  .action-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  .social-tray {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .social-tray a {
    color: #7b8ea8;
    font-size: 1.2rem;
    transition: color 0.2s;
  }

  .social-tray a:hover {
    color: var(--player-o);
  }

  footer {
    margin-top: 14px;
    font-size: 0.75rem;
    color: #5d6f88;
  }
</style>
</head>
<body>

<div class="arcade-card">
  <div class="badge"><i class="fas fa-microchip"></i> Minimax Pro Engine</div>
  <h1>Tic Tac Toe</h1>

  <div class="settings-row">
    <select id="mode-picker" onchange="resetGameSession()">
      <option value="pve">Bot Challenge (AI)</option>
      <option value="pvp">Local Pass &amp; Play</option>
    </select>
    <select id="difficulty-picker" onchange="resetGameSession()">
      <option value="easy">Cadet (Easy)</option>
      <option value="medium">Officer (Medium)</option>
      <option value="impossible" selected>Grandmaster (Unbeatable)</option>
    </select>
  </div>

  <div class="metrics-board">
    <div class="metric-item">
      <span class="metric-label">X Wins</span>
      <span class="metric-value" id="score-x" style="color: var(--player-x);">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Stalemates</span>
      <span class="metric-value" id="score-ties" style="color: #ffffff;">0</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">O Wins</span>
      <span class="metric-value" id="score-o" style="color: var(--player-o);">0</span>
    </div>
  </div>

  <div id="status-feed">Player X to Move</div>

  <div class="board-wrapper">
    <div class="grid" id="game-grid">
      <div class="cell" onclick="handleTileSelection(0)"></div>
      <div class="cell" onclick="handleTileSelection(1)"></div>
      <div class="cell" onclick="handleTileSelection(2)"></div>
      <div class="cell" onclick="handleTileSelection(3)"></div>
      <div class="cell" onclick="handleTileSelection(4)"></div>
      <div class="cell" onclick="handleTileSelection(5)"></div>
      <div class="cell" onclick="handleTileSelection(6)"></div>
      <div class="cell" onclick="handleTileSelection(7)"></div>
      <div class="cell" onclick="handleTileSelection(8)"></div>
    </div>
  </div>

  <button class="action-btn" onclick="resetGameSession()"><i class="fas fa-rotate-right"></i> Reset Match</button>

  <div class="social-tray">
    <a href="https://github.com/MonowarHusain" target="_blank"><i class="fab fa-github"></i></a>
    <a href="https://twitter.com/MonowarHusain" target="_blank"><i class="fab fa-twitter"></i></a>
    <a href="https://www.linkedin.com/in/MonowarHusain" target="_blank"><i class="fab fa-linkedin"></i></a>
  </div>
</div>

<script>
  // Web Audio Synthesizer (No external asset dependency)
  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    },
    play(freq, type, duration) {
      try {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      } catch (e) {}
    },
    click() { this.play(550, 'sine', 0.08); },
    placeO() { this.play(380, 'sine', 0.1); },
    victory() {
      [440, 554, 659, 880].forEach((f, idx) => {
        setTimeout(() => this.play(f, 'triangle', 0.25), idx * 90);
      });
    },
    draw() { this.play(180, 'sawtooth', 0.25); }
  };

  const WIN_MASKS = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  let board = Array(9).fill('');
  let turn = 'X';
  let active = true;
  let computing = false;
  let transpositionTable = new Map();
  const scores = { X: 0, O: 0, ties: 0 };

  function handleTileSelection(index) {
    if (!active || board[index] !== '' || computing) return;

    commitMove(index, turn);
    AudioEngine.click();

    const result = evaluateState(board);
    if (result) {
      concludeSession(result);
      return;
    }

    turn = turn === 'X' ? 'O' : 'X';
    updateFeed();

    const mode = document.getElementById('mode-picker').value;
    if (mode === 'pve' && turn === 'O') {
      computing = true;
      updateFeed();
      setTimeout(() => {
        dispatchAiTurn();
        computing = false;
      }, 250);
    }
  }

  function commitMove(index, player) {
    board[index] = player;
    const tile = document.getElementById('game-grid').children[index];
    tile.innerText = player;
    tile.classList.add(player.toLowerCase(), 'locked');
  }

  function dispatchAiTurn() {
    if (!active) return;
    const diff = document.getElementById('difficulty-picker').value;
    let chosenIndex;

    if (diff === 'easy') {
      chosenIndex = getRandomAvailableSlot();
    } else if (diff === 'medium') {
      chosenIndex = (Math.random() < 0.65) ? resolveMinimaxOptimal() : getRandomAvailableSlot();
    } else {
      chosenIndex = resolveMinimaxOptimal();
    }

    commitMove(chosenIndex, 'O');
    AudioEngine.placeO();

    const result = evaluateState(board);
    if (result) {
      concludeSession(result);
      return;
    }

    turn = 'X';
    updateFeed();
  }

  function getRandomAvailableSlot() {
    const slots = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
    return slots[Math.floor(Math.random() * slots.length)];
  }

  // Optimized Minimax with Alpha-Beta Pruning & State Caching
  function resolveMinimaxOptimal() {
    // Immediate Center Take optimization if available on empty/opening boards
    if (board[4] === '') return 4;

    let bestVal = -Infinity;
    let optimalAction = -1;
    transpositionTable.clear();

    for (let i = 0; i < 9; i++) {
      if (board[i] === '') {
        board[i] = 'O';
        let val = minimax(board, 0, false, -Infinity, Infinity);
        board[i] = '';
        if (val > bestVal) {
          bestVal = val;
          optimalAction = i;
        }
      }
    }
    return optimalAction;
  }

  function minimax(nodeBoard, depth, isMaximizing, alpha, beta) {
    const hash = nodeBoard.join('') + (isMaximizing ? ':MAX' : ':MIN');
    if (transpositionTable.has(hash)) return transpositionTable.get(hash);

    const outcome = evaluateState(nodeBoard);
    if (outcome) {
      if (outcome.winner === 'O') return 100 - depth;
      if (outcome.winner === 'X') return depth - 100;
      if (outcome.tie) return 0;
    }

    if (isMaximizing) {
      let maxScore = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (nodeBoard[i] === '') {
          nodeBoard[i] = 'O';
          let score = minimax(nodeBoard, depth + 1, false, alpha, beta);
          nodeBoard[i] = '';
          maxScore = Math.max(score, maxScore);
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
      }
      transpositionTable.set(hash, maxScore);
      return maxScore;
    } else {
      let minScore = Infinity;
      for (let i = 0; i < 9; i++) {
        if (nodeBoard[i] === '') {
          nodeBoard[i] = 'X';
          let score = minimax(nodeBoard, depth + 1, true, alpha, beta);
          nodeBoard[i] = '';
          minScore = Math.min(score, minScore);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
      }
      transpositionTable.set(hash, minScore);
      return minScore;
    }
  }

  function evaluateState(b) {
    for (let combo of WIN_MASKS) {
      const [p1, p2, p3] = combo;
      if (b[p1] && b[p1] === b[p2] && b[p1] === b[p3]) {
        return { winner: b[p1], line: combo };
      }
    }
    if (b.every(cell => cell !== '')) return { tie: true };
    return null;
  }

  function concludeSession(result) {
    active = false;
    const feed = document.getElementById('status-feed');

    if (result.tie) {
      feed.innerText = "Stalemate! Balanced defense.";
      scores.ties++;
      document.getElementById('score-ties').innerText = scores.ties;
      AudioEngine.draw();
    } else {
      feed.innerText = `Victory: Player ${result.winner} Secures the Grid!`;
      scores[result.winner]++;
      document.getElementById(`score-${result.winner.toLowerCase()}`).innerText = scores[result.winner];
      result.line.forEach(i => {
        document.getElementById('game-grid').children[i].classList.add('win-highlight');
      });
      AudioEngine.victory();
    }
  }

  function updateFeed() {
    const feed = document.getElementById('status-feed');
    const mode = document.getElementById('mode-picker').value;

    if (computing) {
      feed.innerText = "Bot computing move...";
      return;
    }
    if (mode === 'pve') {
      feed.innerText = turn === 'X' ? "Your Turn (X)" : "Waiting for Bot...";
    } else {
      feed.innerText = `Player ${turn}'s Turn`;
    }
  }

  function resetGameSession() {
    board.fill('');
    turn = 'X';
    active = true;
    computing = false;
    updateFeed();

    const cells = document.querySelectorAll('.cell');
    cells.forEach(c => {
      c.innerText = '';
      c.className = 'cell';
    });
  }
</script>
</body>
</html>
