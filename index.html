<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe // Gameloft Edition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
  :root {
    --bg-dark: #0a0e17;
    --card-bg: #131b2e;
    --accent-neon: #00e5ff;
    --player-x: #ff3366;
    --player-o: #00e5ff;
    --win-glow: #39ff14;
    --text-muted: #8a99ad;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: radial-gradient(circle at center, #1b263b 0%, var(--bg-dark) 100%);
    color: #ffffff;
    box-sizing: border-box;
    user-select: none;
  }

  #game-container {
    width: 100%;
    max-width: 420px;
    padding: 24px;
    border-radius: 16px;
    background: var(--card-bg);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.08);
  }

  .header-tag {
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-neon);
    margin-bottom: 4px;
    font-weight: 700;
  }

  h1 {
    margin: 0 0 16px 0;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .controls-bar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 20px;
  }

  select, button {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background-color: #1c273e;
    color: #ffffff;
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
  }

  select:hover, button:hover {
    background-color: #263554;
    border-color: var(--accent-neon);
  }

  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: rgba(0, 0, 0, 0.25);
    padding: 12px 8px;
    border-radius: 8px;
    margin-bottom: 20px;
  }

  .score-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .score-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .score-num {
    font-size: 1.25rem;
    font-weight: 700;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 8px;
    aspect-ratio: 1 / 1;
    margin-bottom: 20px;
  }

  .cell {
    position: relative;
    background: #182239;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.7rem;
    font-weight: 800;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  .cell:hover:not(.played) {
    background-color: #223050;
  }

  .cell:active:not(.played) {
    transform: scale(0.97);
  }

  .cell.played {
    cursor: default;
  }

  .cell.x {
    color: var(--player-x);
    text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
  }

  .cell.o {
    color: var(--player-o);
    text-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
  }

  .cell.highlight {
    background: rgba(57, 255, 20, 0.15);
    box-shadow: inset 0 0 0 2px var(--win-glow);
  }

  #status-message {
    min-height: 24px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    color: #e2e8f0;
  }

  .reset-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent-neon);
    color: #050b14;
    border: none;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .reset-btn:hover {
    background: #40ebff;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    color: #050b14;
  }

  .social-icons {
    margin-top: 18px;
  }

  .social-icons a {
    color: var(--text-muted);
    font-size: 1.1rem;
    margin: 0 8px;
    transition: color 0.2s ease;
  }

  .social-icons a:hover {
    color: var(--accent-neon);
  }

  footer {
    margin-top: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

  <div id="game-container">
    <div class="header-tag">Gameloft Arcade</div>
    <h1>Tic Tac Toe</h1>

    <div class="controls-bar">
      <select id="game-mode" onchange="initGame()">
        <option value="ai">Vs Bot (PvE)</option>
        <option value="pvp">Local (PvP)</option>
      </select>

      <select id="difficulty" onchange="initGame()">
        <option value="easy">Cadet (Easy)</option>
        <option value="medium">Ace (Balanced)</option>
        <option value="impossible" selected>Grandmaster (Minimax)</option>
      </select>
    </div>

    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">X Wins</span>
        <span class="score-num" id="xWins" style="color: var(--player-x);">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Ties</span>
        <span class="score-num" id="ties" style="color: var(--text-muted);">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">O Wins</span>
        <span class="score-num" id="oWins" style="color: var(--player-o);">0</span>
      </div>
    </div>

    <div id="status-message">Player X's Turn</div>

    <div class="board" id="board">
      <div class="cell" onclick="handleTurn(0)"></div>
      <div class="cell" onclick="handleTurn(1)"></div>
      <div class="cell" onclick="handleTurn(2)"></div>
      <div class="cell" onclick="handleTurn(3)"></div>
      <div class="cell" onclick="handleTurn(4)"></div>
      <div class="cell" onclick="handleTurn(5)"></div>
      <div class="cell" onclick="handleTurn(6)"></div>
      <div class="cell" onclick="handleTurn(7)"></div>
      <div class="cell" onclick="handleTurn(8)"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">Restart Game</button>

    <div class="social-icons">
      <a href="https://github.com/MonowarHusain" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://twitter.com/MonowarHusain" target="_blank"><i class="fab fa-twitter"></i></a>
      <a href="https://www.linkedin.com/in/MonowarHusain" target="_blank"><i class="fab fa-linkedin"></i></a>
    </div>
  </div>

  <footer>Gameloft Arcade Platform &bull; Production v2.0</footer>

<script>
  let boardState = ['', '', '', '', '', '', '', '', ''];
  let currentTurn = 'X';
  let isGameOver = false;
  let isThinking = false;

  let stats = { X: 0, O: 0, ties: 0 };

  const WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  function handleTurn(index) {
    if (boardState[index] !== '' || isGameOver || isThinking) return;

    commitMove(index, currentTurn);

    const winData = checkWinner(boardState);
    if (winData) {
      finalizeGame(winData);
      return;
    }

    if (boardState.every(c => c !== '')) {
      finalizeGame({ tie: true });
      return;
    }

    currentTurn = currentTurn === 'X' ? 'O' : 'X';
    updateStatusDisplay();

    const mode = document.getElementById('game-mode').value;
    if (mode === 'ai' && currentTurn === 'O') {
      isThinking = true;
      const delay = Math.floor(Math.random() * 200) + 300;
      setTimeout(() => {
        runAiTurn();
        isThinking = false;
      }, delay);
    }
  }

  function commitMove(index, player) {
    boardState[index] = player;
    const cell = document.getElementById('board').children[index];
    cell.innerText = player;
    cell.classList.add('played', player.toLowerCase());
  }

  function runAiTurn() {
    if (isGameOver) return;
    const diff = document.getElementById('difficulty').value;
    let chosenIndex;

    if (diff === 'easy') {
      chosenIndex = getRandomMove();
    } else if (diff === 'medium') {
      chosenIndex = (Math.random() < 0.6) ? getMinimaxMove() : getRandomMove();
    } else {
      chosenIndex = getMinimaxMove();
    }

    commitMove(chosenIndex, 'O');

    const winData = checkWinner(boardState);
    if (winData) {
      finalizeGame(winData);
      return;
    }

    if (boardState.every(c => c !== '')) {
      finalizeGame({ tie: true });
      return;
    }

    currentTurn = 'X';
    updateStatusDisplay();
  }

  function getRandomMove() {
    const freeIndices = boardState
      .map((val, idx) => val === '' ? idx : null)
      .filter(idx => idx !== null);
    return freeIndices[Math.floor(Math.random() * freeIndices.length)];
  }

  function getMinimaxMove() {
    let bestScore = -Infinity;
    let bestMove = -1;

    for (let i = 0; i < 9; i++) {
      if (boardState[i] === '') {
        boardState[i] = 'O';
        let score = minimax(boardState, 0, false, -Infinity, Infinity);
        boardState[i] = '';
        if (score > bestScore) {
          bestScore = score;
          bestMove = i;
        }
      }
    }
    return bestMove;
  }

  function minimax(board, depth, isMaximizing, alpha, beta) {
    const winner = checkWinner(board);
    if (winner) return winner.player === 'O' ? (10 - depth) : (depth - 10);
    if (board.every(cell => cell !== '')) return 0;

    if (isMaximizing) {
      let maxScore = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (board[i] === '') {
          board[i] = 'O';
          let score = minimax(board, depth + 1, false, alpha, beta);
          board[i] = '';
          maxScore = Math.max(score, maxScore);
          alpha = Math.max(alpha, score);
          if (beta <= alpha) break;
        }
      }
      return maxScore;
    } else {
      let minScore = Infinity;
      for (let i = 0; i < 9; i++) {
        if (board[i] === '') {
          board[i] = 'X';
          let score = minimax(board, depth + 1, true, alpha, beta);
          board[i] = '';
          minScore = Math.min(score, minScore);
          beta = Math.min(beta, score);
          if (beta <= alpha) break;
        }
      }
      return minScore;
    }
  }

  function checkWinner(board) {
    for (let combo of WIN_LINES) {
      const [a, b, c] = combo;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { player: board[a], combo: combo };
      }
    }
    return null;
  }

  function finalizeGame(result) {
    isGameOver = true;
    const status = document.getElementById('status-message');

    if (result.tie) {
      status.innerText = "Stalemate! Game is a Draw.";
      stats.ties++;
      document.getElementById('ties').innerText = stats.ties;
    } else {
      status.innerText = `Victory! Player ${result.player} dominates!`;
      stats[result.player]++;
      document.getElementById(`${result.player.toLowerCase()}Wins`).innerText = stats[result.player];
      
      result.combo.forEach(idx => {
        document.getElementById('board').children[idx].classList.add('highlight');
      });
    }
  }

  function updateStatusDisplay() {
    const mode = document.getElementById('game-mode').value;
    const status = document.getElementById('status-message');
    if (mode === 'ai') {
      status.innerText = currentTurn === 'X' ? "Your Turn (X)" : "AI is calculating...";
    } else {
      status.innerText = `Player ${currentTurn}'s Turn`;
    }
  }

  function initGame() {
    boardState = ['', '', '', '', '', '', '', '', ''];
    currentTurn = 'X';
    isGameOver = false;
    isThinking = false;
    updateStatusDisplay();

    const cells = document.querySelectorAll('.cell');
    cells.forEach(cell => {
      cell.innerText = '';
      cell.className = 'cell';
    });
  }
</script>
</body>
</html>
